[project]
name = "cl-stack-demos"
version = "0.1.0"
description = "Python reference slices for cl-stack-demos"
requires-python = ">=3.12"
dependencies = [
  "click>=8.1",
  "structlog>=24.1",
  "PyJWT>=2.8",
  "websockets>=12.0",
  "requests>=2.31",
  "Flask>=3.0",
  "SQLAlchemy>=2.0",
  "Authlib>=1.3",
  "jsonlines>=4.0",
  "records>=0.5.3",
  "tablib>=3.5",
  "openpyxl>=3.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
