<main>
<article><h1 id="notes-on-markup">Notes on markup</h1>
<p>Some <em>emphasis</em>, <code>code</code>, a <a href="https://example.com">link</a> and <del>strike</del>.</p>
<p><img src="https://cdn.example/images/diagram.svg" alt=""></p>
<ul>

<li>two</li>
</ul>
<table>
<thead>

</thead>
<tbody>
<tr><td align="left">ada</td><td align="right">2</td></tr>

</article>
