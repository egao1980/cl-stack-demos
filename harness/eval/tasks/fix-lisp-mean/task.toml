schema_version = "1.1"

[task]
name = "harness-demos/fix-lisp-mean"
description = "Fix a Common Lisp function so an sbcl --script test passes."
keywords = ["common-lisp", "bugfix"]

[metadata]
difficulty = "easy"
category = "debugging"
tags = ["common-lisp", "bugfix"]
expert_time_estimate_min = 2.0

[verifier]
timeout_sec = 60.0

[agent]
# Generous: the live demo model generates about 12 tokens/s.
timeout_sec = 900.0

[environment]
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 2048
gpus = 0
# The tests and the solution need no network; an agent needs its model endpoint.
allow_internet = true
